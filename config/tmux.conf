# tmux server dedicated to the Claude sessions served in the browser.
set -g status off
set -g mouse on
set -g history-limit 50000
set -g default-terminal "xterm-256color"
set -g focus-events on
set -g destroy-unattached off

# Mouse reporting is on, so a plain drag selects inside tmux and never reaches
# the browser. These bindings send what was selected to the system clipboard —
# the Windows one when running under WSL — so an ordinary selection can be
# pasted anywhere. Holding Shift bypasses tmux entirely and selects in the page
# instead, which the injected script copies as well.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "claude-tabs-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "claude-tabs-copy"
bind -T copy-mode    DoubleClick1Pane  send -X select-word \; send -X copy-pipe-no-clear "claude-tabs-copy"
bind -T copy-mode-vi DoubleClick1Pane  send -X select-word \; send -X copy-pipe-no-clear "claude-tabs-copy"
bind -T copy-mode    Enter             send -X copy-pipe-and-cancel "claude-tabs-copy"
bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "claude-tabs-copy"
